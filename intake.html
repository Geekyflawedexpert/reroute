<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reroute — what kind of scroller are you?</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css?v=202609110345">
</head>
<body>
<div class="app">
  <p class="eyebrow">Reroute · <b id="prog">question 1 of 8</b></p>
  <div id="stage"></div>
</div>

<script src="levers.js?v=202609110345"></script>
<script src="prior.js?v=202609110345"></script>
<script src="store.js?v=202609110345"></script>
<script src="intake.js?v=202609110345"></script>
<script>
(function () {
  var stage = document.getElementById('stage'), prog = document.getElementById('prog');
  var answers = [], qi = 0;

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function renderQuestion() {
    prog.textContent = 'question ' + (qi + 1) + ' of ' + RB.QUESTIONS.length;
    stage.innerHTML = '';
    var Q = RB.QUESTIONS[qi];
    stage.appendChild(el('h1', null, Q.q));
    var wrap = el('div', 'stack');
    Q.a.forEach(function (opt, i) {
      var b = el('button', 'alt', '<span>' + opt[0] + '</span>');
      b.type = 'button';
      b.addEventListener('click', function () {
        answers[qi] = i;
        qi++;
        qi < RB.QUESTIONS.length ? renderQuestion() : renderGoal();
      });
      wrap.appendChild(b);
    });
    stage.appendChild(wrap);
    if (qi > 0) {
      var back = el('button', 'ghost', 'Back');
      back.type = 'button';
      back.addEventListener('click', function () { qi--; renderQuestion(); });
      stage.appendChild(back);
    }
  }

  function renderGoal() {
    prog.textContent = 'last one';
    stage.innerHTML = '';
    stage.appendChild(el('h1', null, 'Where do you want to <span class="hl">end up</span>?'));
    stage.appendChild(el('p', null,
      'This sets your daily budget. It’s a target, not a wall — you can always go past it, ' +
      'and you get two flexible days a week with no questions asked.'));

    var wrap = el('div', 'stack');
    RB.GOALS.forEach(function (g) {
      var b = el('button', 'alt',
        '<span class="row-item"><span class="t">' + g.label + '</span>' +
        '<span class="d">' + g.sub + '</span></span>');
      b.type = 'button';
      b.addEventListener('click', function () { g.asksMinutes ? askMinutes(g) : commitGoal(g, g.mins); });
      wrap.appendChild(b);
    });
    stage.appendChild(wrap);
  }

  function askMinutes(g) {
    stage.innerHTML = '';
    stage.appendChild(el('h1', null, 'How many minutes a day?'));
    stage.appendChild(el('p', null,
      'Pick something you’d actually hit. A number you miss every day teaches you the system doesn’t work.'));
    var wrap = el('div', 'stack');
    [15, 30, 45, 60].forEach(function (m) {
      var b = el('button', 'alt', '<span>' + m + ' minutes</span>');
      b.type = 'button';
      b.addEventListener('click', function () { commitGoal(g, m); });
      wrap.appendChild(b);
    });
    stage.appendChild(wrap);
  }

  function commitGoal(g, mins) {
    var cfg = RB.store.config();
    cfg.goal = { mode: g.mode, dailyMinutes: mins };
    RB.store.saveConfig(cfg);
    renderResult();
  }

  function renderResult() {
    var r = RB.score(answers);
    RB.store.saveIntake(r);
    prog.textContent = 'your read';

    var pri = RB.lever(r.primary), sec = RB.lever(r.secondary);
    stage.innerHTML = '';
    stage.appendChild(el('h1', null, RB.HEADLINES[r.primary]));
    stage.appendChild(el('p', 'lead', RB.READS[r.primary]));

    var c = el('div', 'card');
    c.appendChild(el('p', 'q', 'Your two levers'));
    var lv = el('div', 'rows');
    lv.appendChild(el('div', 'row-item', '<span class="t">' + pri.label + '</span><span class="d">' + pri.sub + '</span>'));
    lv.appendChild(el('div', 'row-item', '<span class="t">' + sec.label + '</span><span class="d">' + sec.sub + '</span>'));
    c.appendChild(lv);
    stage.appendChild(c);

    var units = (RB.UNITS[r.primary] || []).slice(0, 3);
    var u = el('div', 'card');
    u.appendChild(el('p', 'q', 'What you’ll be offered instead'));
    var list = el('div', 'rows');
    units.forEach(function (x) {
      list.appendChild(el('div', 'row-item',
        '<span class="t">' + x.title + '</span>' +
        '<span class="d">' + (x.note || '') + '</span>'));
    });
    u.appendChild(list);
    stage.appendChild(u);

    var g = RB.store.config().goal;
    var gLabel = (RB.GOALS.filter(function (x) { return x.mode === g.mode; })[0] || {}).label || '';
    stage.appendChild(el('p', null,
      'Week one changes nothing else. Nothing gets blocked, nothing gets deleted, and every open is still allowed. ' +
      'You’ll get a number on day one and your own pattern by day three.'));
    stage.appendChild(el('p', 'hint',
      'Goal: ' + gLabel.toLowerCase() + ' · starting budget ' + RB.store.budgetToday() + ' min/day · ' +
      'two flexible days a week.'));

    var go = el('button', 'primary',
      '<span>Start day 1</span><span class="why">21 days · nothing blocked this week</span>');
    go.type = 'button';
    go.addEventListener('click', function () {
      var cfg = RB.store.config();
      if (!cfg.start) { cfg.start = Date.now(); RB.store.saveConfig(cfg); }
      location.href = 'index.html';
    });
    stage.appendChild(go);

    var wire = el('a', 'ghost', 'Wire it to Instagram');
    wire.href = 'setup.html';
    stage.appendChild(wire);

    var again = el('button', 'ghost', 'Retake');
    again.type = 'button';
    again.addEventListener('click', function () { answers = []; qi = 0; renderQuestion(); });
    stage.appendChild(again);
  }

  renderQuestion();
})();
</script>
</body>
</html>
